/**:
  ros__parameters:
    wheel_radius: 0.10
    # Calibrated MoMo geometry from the original ROS 1 controller config.
    wheelbase: 0.54
    track_width: 0.58
    # Original ros_canopen conversion used 21 motor revolutions per wheel turn.
    gear_ratio: 21.0
    # Node order: front-left, front-right, rear-left, rear-right.
    # All EPOS4 units use the same command sign on this robot.
    motor_directions: [1.0, 1.0, 1.0, 1.0]
    # Keep below the EPOS4 max profile velocity of 3170 rpm configured in the
    # motor DCF files. At 21:1 with 0.10 m wheels, 3000 rpm is about 1.50 m/s.
    max_motor_rpm: 3000.0
    max_linear_velocity: 4.0
    max_angular_velocity: 3.0
    # Accelerate at about 10000 motor rpm/s, matching the EPOS profile setting.
    # This reaches the 3000 rpm ceiling in approximately 0.3 seconds.
    max_wheel_acceleration: 1050.0
    # Stop at about 10000 motor rpm/s, matching the EPOS profile deceleration.
    # From the 3000 rpm ceiling this produces an approximately 0.3 second stop.
    max_wheel_deceleration: 1050.0
    # Zero latches the last cmd_vel until a new command is received. Keyboard
    # teleop sends an explicit zero for its stop keys (k or space).
    command_timeout: 0.0
    publish_rate: 50.0
    auto_start: true
    service_timeout: 30.0
    # The CANopen bus can still be mid-boot (config download to other nodes)
    # when this node starts. Firing 'init' at a node while the bus is busy
    # with another node's boot handshake makes the CiA402 state transition
    # time out, which can cascade into the whole device_container crashing.
    # Settle first, then retry patiently instead of giving up in ~3s.
    startup_settle_delay: 30.0
    # The retry budget has to outlast the slowest possible CANopen boot, or
    # init is abandoned on a drive that was about to come up. Observed
    # 2026-09-11: drive 3 took 59.9s to boot (the bus.yml master
    # boot_timeout: 60000 expiring) and reported ready 0.1s AFTER attempt
    # 10/10 failed -- the launch failed by a tenth of a second. bus.yml allows
    # boot_timeout_ms: 90000 per drive, so budget for more than that:
    # 30s settle + 40 * 3s = 150s. Cost is only that a genuinely dead drive
    # takes longer to be declared dead.
    startup_retries: 40
    startup_retry_delay: 3.0
    startup_drive_stagger: 2.0
    direct_can_velocity: true
    can_interface: can0
    cmd_vel_topic: cmd_vel_switched
    # odom->base_link TF broadcast from mecanum_wheel_odometry. OFF for live
    # operation: the Qualisys mocap publishes map->base_link directly, and
    # base_link cannot have two TF parents. Turn this on only for bag replay
    # with AMCL, which needs an odom->base_link edge -- and then make sure
    # qualisys_localization_node is NOT running in that session.
    # epos4_controller does not read this param, so sharing it on the /**
    # wildcard block is safe.
    publish_tf: false
