joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 50.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    # Logitech F710 in XInput (X) mode: LB enables normal motion and RB
    # selects the faster turbo scales.
    enable_button: 4
    enable_turbo_button: 5
    axis_linear:
      x: 1
      y: 0
    axis_angular:
      yaw: 3
    scale_linear:
      x: 1.0
      y: 1.0
    scale_angular:
      yaw: 1.5
    scale_linear_turbo:
      x: 1.5
      y: 1.5
    scale_angular_turbo:
      yaw: 2.0
