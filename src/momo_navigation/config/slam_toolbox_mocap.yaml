# slam_toolbox configured as a pure mapper on top of the mocap pose.
#
# qualisys_localization_node publishes odom->base_link from the Qualisys
# rigid body, and the mocap launch publishes a static identity map->odom, so
# both "map" and "odom" coincide with the mocap origin. Scan matching and loop
# closure are disabled so every scan is inserted at its mocap pose unchanged:
# the resulting map is in mocap coordinates no matter where mapping starts.
#
# When mocap loses the robot, the localization node keeps re-broadcasting the
# last good pose, so the robot appears stationary, never exceeds the minimum
# travel thresholds, and no scans are inserted until tracking returns.
/**:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # Front TiM (tim_2). slam_toolbox takes a single scan topic.
    scan_topic: /MoMo/scan_2
    # Default is the absolute "/map"; keep clear of the map_server that
    # already publishes /MoMo/map.
    map_name: /MoMo/slam_map
    use_map_saver: false
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    # 0 = never publish map->odom; the static identity from the mocap launch
    # stays the only source.
    transform_publish_period: 0.0
    map_update_interval: 2.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
