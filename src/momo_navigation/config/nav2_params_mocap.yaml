bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Jazzy-native BT node registration: plugin_lib_names (Humble-style) is
    # obsolete and double-registers BT nodes internally, causing
    # "ID [ComputePathToPose] already registered" -> bt_navigator segfault.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # ranger_nav pairs controller_frequency with model_dt (20Hz = 1/0.05).
    # MoMo's CPU measured 11.9Hz actual throughput at that pairing with
    # batch_size 1000 (single-threaded MPPI solve took ~84ms, not 50ms) --
    # desyncing the warm-started control sequence every cycle. Dropped to
    # 10Hz/0.1 to give the solve enough real headroom; this is the one
    # deliberate deviation from ranger_nav's numbers, justified by measured
    # compute, not copied from anywhere.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 3.14
      rot_stopped_velocity: 0.08
      trans_stopped_velocity: 0.05

    FollowPath:
      # RotationShimController: forces an in-place rotation towards the path
      # heading before handing off to MPPI, so sharp turns don't get cut by
      # the omni controller driving sideways.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      use_path_orientations: true
      angular_dist_threshold: 3.15 # deactivated if larger than pi
      angular_disengage_threshold: 0.785 # 45 deg: hand off to MPPI once aligned within 45 deg
      rotate_to_goal_heading: true
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 0.6
      closed_loop: true
      simulate_ahead_time: 1.0

      motion_model: "Omni"
      time_steps: 56
      model_dt: 0.1
      batch_size: 1000
      vx_max: 1.0
      vx_min: -1.0
      vy_max: 1.0
      vy_min: -1.0
      wz_max: 1.9
      iteration_count: 1

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 100.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # MoMo's real footprint (0.76m x 0.64m), from momo_description.
      footprint: "[ [0.38, 0.32], [0.38, -0.32], [-0.38, -0.32], [-0.38, 0.32] ]"
      # static_layer added and kept in plugins, unlike ranger_nav: with no
      # lidar (both units currently disconnected), voxel_layer never
      # marks/clears anything, so the local costmap stayed entirely
      # "unknown" everywhere. ObstaclesCritic grading footprint cost against
      # an all-unknown costmap treats every trajectory as equally risky and
      # suppresses speed uniformly regardless of vx_max. Seeding it from the
      # static map gives it real known-free-space ground truth instead --
      # this is a stand-in for the missing sensor, not a tuning preference.
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        # observation_sources left unset: both lidars are disconnected.
        # Static + inflation layers still provide map-based avoidance.
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer",
                #"obstacle_layer",
                "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # observation_sources left unset: both lidars are disconnected.
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true
      allow_unknown: true
      tolerance: 0.5

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    # mocap setup has no fused wheel/lidar odometry topic, only tf, so the
    # smoother runs open-loop -- ranger_nav has real odometry/filtered and
    # runs CLOSED_LOOP.
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 2.5]
    min_velocity: [-1.0, -1.0, -2.5]
    deadband_velocity: [0.02, 0.02, 0.0]
    velocity_timeout: 1.0
    max_accel: [1.5, 1.5, 3.0]
    max_decel: [-5.0, -5.0, -5.0]
    odom_topic: "odom"
    odom_duration: 0.1
